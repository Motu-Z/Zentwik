name: AOT Probe

on:
  workflow_dispatch:

  push:
    branches: [main]
    paths:
      - 'Zentwik.Core/**'
      - 'Zentwik.Worker/**'
      - 'build/Zentwik.AotProbe/**'
      - '.github/workflows/aot-probe.yml'

  pull_request:
    paths:
      - 'Zentwik.Core/**'
      - 'Zentwik.Worker/**'
      - 'build/Zentwik.AotProbe/**'

jobs:
  native-aot:
    name: Build & run Core under Native AOT
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish (Native AOT, warnings as errors)
        run: >
          dotnet publish build/Zentwik.AotProbe
          -c Release
          -r win-x64
          -p:PublishAot=true
          -p:EnableTrimAnalyzer=true
          -warnaserror
          -o publish

      - name: Run probe
        run: ./publish/Zentwik.AotProbe.exe

      - name: Report binary size
        run: |
          $exe = Get-Item ./publish/Zentwik.AotProbe.exe
          Write-Host ("Native binary: {0:N2} MB" -f ($exe.Length / 1MB))

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zentwik-AotProbe-win-x64
          path: publish/
          retention-days: 14

  worker-aot:
    name: Build & link Worker under Native AOT
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Worker (Native AOT, warnings as errors)
        run: >
          dotnet publish Zentwik.Worker/Zentwik.Worker.csproj
          -c Release
          -r win-x64
          -p:PublishAot=true
          -p:TrimmerSingleWarn=false
          -p:SuppressTrimAnalysisWarnings=false
          -p:DebugType=None
          -p:DebugSymbols=false
          -warnaserror
          -o publish-worker

      - name: Verify native output
        run: |
          if (-not (Test-Path ./publish-worker/Zentwik.Worker.exe)) { throw "Zentwik.Worker.exe 缺失" }
          if (Test-Path ./publish-worker/Zentwik.Worker.dll) { throw "仍是托管产物（存在 .dll），Native AOT 未生效" }
          if (Test-Path ./publish-worker/Zentwik.Worker.runtimeconfig.json) { throw "存在 runtimeconfig.json，Native AOT 未生效" }
          if (-not (Test-Path ./publish-worker/PawnIO/RyzenSMU.bin)) { throw "PawnIO 模块未随包落地" }
          $exe = Get-Item ./publish-worker/Zentwik.Worker.exe
          Write-Host ("Worker native exe: {0:N2} MB" -f ($exe.Length / 1MB))

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zentwik-Worker-Aot-win-x64
          path: publish-worker/
          retention-days: 14

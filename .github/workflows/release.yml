name: Build and Release Zentwik

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: '要发布的 Tag 名称 (例如 v1.2.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ github.event.inputs.tag_name || github.ref }}
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Publish UI
      run: |
        dotnet publish Zentwik.UI/Zentwik.UI.csproj -c Release -r win-x64 --self-contained false -p:PublishReadyToRun=true -p:PublishSingleFile=true -o ./publish

    - name: Publish Worker (Native AOT)
      run: |
        dotnet publish Zentwik.Worker/Zentwik.Worker.csproj -c Release -r win-x64 -p:PublishAot=true -p:TrimmerSingleWarn=false -p:DebugType=None -p:DebugSymbols=false -o ./publish

    - name: Verify AOT Worker
      run: |
        if (-not (Test-Path ./publish/Zentwik.Worker.exe)) { throw "Zentwik.Worker.exe 缺失" }
        if (Test-Path ./publish/Zentwik.Worker.dll) { throw "Worker 仍是托管产物（存在 .dll），Native AOT 未生效" }
        if (Test-Path ./publish/Zentwik.Worker.runtimeconfig.json) { throw "存在 runtimeconfig.json，Native AOT 未生效" }
        if (-not (Test-Path ./publish/WmiLight.Native.dll)) { throw "WmiLight.Native.dll 未随包落地" }
        if (-not (Test-Path ./publish/WinIo32.dll)) { throw "WinIo32.dll 未随包落地" }
        $w = (Get-Item ./publish/Zentwik.Worker.exe).Length
        Write-Host ("Worker native exe: {0:N2} MB" -f ($w / 1MB))

    - name: Create Zip Archive
      run: |
        Compress-Archive -Path ./publish/* -DestinationPath ./Zentwik-win-x64.zip

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.tag_name || github.ref_name }} # 手动触发用 input，推送触发用 ref_name
        files: ./Zentwik-win-x64.zip
        generate_release_notes: true
        prerelease: ${{ contains(github.ref_name, 'can') || contains(github.event.inputs.tag_name, 'can') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

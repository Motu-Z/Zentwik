name: Build and Release Zentwik

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: '要发布的 Tag 名称 (例如 v1.2.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ github.event.inputs.tag_name || github.ref }}

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Resolve version
      id: ver
      run: |
        $tag = "${{ github.event.inputs.tag_name || github.ref_name }}"
        $v = $tag -replace '^v', ''
        "version=$v" >> $env:GITHUB_OUTPUT
        Write-Host "Version: $v"

    - name: Publish Worker (Native AOT)
      run: |
        dotnet publish Zentwik.Worker/Zentwik.Worker.csproj -c Release -r win-x64 -p:PublishAot=true -p:TrimmerSingleWarn=false -p:DebugType=None -p:DebugSymbols=false -p:OutputPath=./obj/worker-out/ -o ./worker

    - name: Verify AOT Worker
      run: |
        if (-not (Test-Path ./worker/Zentwik.Worker.exe)) { throw "Zentwik.Worker.exe 缺失" }
        if (Test-Path ./worker/Zentwik.Worker.dll) { throw "Worker 仍是托管产物（存在 .dll），Native AOT 未生效" }
        if (Test-Path ./worker/Zentwik.Worker.runtimeconfig.json) { throw "存在 runtimeconfig.json，Native AOT 未生效" }
        if (-not (Test-Path ./worker/PawnIO/RyzenSMU.bin)) { throw "PawnIO 模块未随包落地" }
        $w = (Get-Item ./worker/Zentwik.Worker.exe).Length
        Write-Host ("Worker native exe: {0:N2} MB" -f ($w / 1MB))

    - name: Publish UI (portable)
      run: |
        dotnet publish Zentwik.UI/Zentwik.UI.csproj -c Release -r win-x64 --self-contained false -p:PublishReadyToRun=true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -p:OutputPath=./obj/ui-portable/ -o ./pkg-portable

    - name: Publish UI (standalone)
      run: |
        dotnet publish Zentwik.UI/Zentwik.UI.csproj -c Release -r win-x64 --self-contained true -p:PublishReadyToRun=true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:DebugSymbols=false -p:OutputPath=./obj/ui-standalone/ -o ./pkg-standalone

    - name: Assemble packages
      run: |
        foreach ($dir in './pkg-portable','./pkg-standalone') {
          Copy-Item "./worker/Zentwik.Worker.exe" $dir -Force
          Copy-Item "./worker/PawnIO" "$dir/PawnIO" -Recurse -Force
        }
        foreach ($dir in './pkg-portable','./pkg-standalone') {
          if (-not (Test-Path "$dir/Zentwik.UI.exe")) { throw "$dir 缺少 Zentwik.UI.exe" }
          if (-not (Test-Path "$dir/Zentwik.Worker.exe")) { throw "$dir 缺少 Zentwik.Worker.exe" }
          if (Get-ChildItem $dir -Filter *.pdb) { throw "$dir 残留符号文件" }
          Write-Host ("--- {0} ---" -f $dir)
          Get-ChildItem $dir | Select-Object Name,Length | Format-Table -AutoSize | Out-String | Write-Host
        }

    - name: Create archives
      run: |
        $v = "${{ steps.ver.outputs.version }}"
        Compress-Archive -Path ./pkg-portable/* -DestinationPath "./Zentwik-$v-Portable.zip"
        Compress-Archive -Path ./pkg-standalone/* -DestinationPath "./Zentwik-$v-Standalone.zip"
        Get-ChildItem ./Zentwik-*.zip | Select-Object Name,Length | Format-Table -AutoSize | Out-String | Write-Host

    - name: Install Inno Setup
      shell: pwsh
      run: |
        $exe = Join-Path $env:TEMP 'innosetup.exe'
        curl.exe -sSL -o $exe 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe'
        if (-not (Test-Path $exe)) { throw 'Inno Setup 下载失败' }
        Start-Process -FilePath $exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -Wait
        $iscc = @('C:\Program Files (x86)\Inno Setup 6\ISCC.exe','C:\Program Files\Inno Setup 6\ISCC.exe') | Where-Object { Test-Path $_ } | Select-Object -First 1
        if (-not $iscc) { throw 'ISCC.exe 未找到' }
        "ISCC=$iscc" >> $env:GITHUB_ENV

    - name: Build installer
      shell: pwsh
      run: |
        $v = "${{ steps.ver.outputs.version }}"
        & "$env:ISCC" "/DMyAppVersion=$v" "installer\zentwik.iss"
        if ($LASTEXITCODE -ne 0) { throw "ISCC 编译失败：完整包（退出码 $LASTEXITCODE）" }
        & "$env:ISCC" "/DMyAppVersion=$v" "/DLite" "installer\zentwik.iss"
        if ($LASTEXITCODE -ne 0) { throw "ISCC 编译失败：精简包（退出码 $LASTEXITCODE）" }
        $full = Get-ChildItem ./dist -Filter '*-Setup.exe'
        $lite = Get-ChildItem ./dist -Filter '*-Setup-Lite.exe'
        if (-not $full) { throw '未产出 Setup.exe' }
        if (-not $lite) { throw '未产出 Setup-Lite.exe' }
        Get-ChildItem ./dist -Filter '*-Setup*.exe' | Select-Object Name,Length | Format-Table -AutoSize | Out-String | Write-Host

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
        files: |
          ./Zentwik-${{ steps.ver.outputs.version }}-Portable.zip
          ./Zentwik-${{ steps.ver.outputs.version }}-Standalone.zip
          ./dist/Zentwik-${{ steps.ver.outputs.version }}-Setup.exe
          ./dist/Zentwik-${{ steps.ver.outputs.version }}-Setup-Lite.exe
        generate_release_notes: true
        prerelease: ${{ contains(github.ref_name, 'can') || contains(github.event.inputs.tag_name, 'can') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

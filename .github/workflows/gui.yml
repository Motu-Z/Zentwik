name: Zentwik Next | GUI (Flutter)

# 纯 Dart/Widget 的静态分析与单测不需要 Windows：
# ubuntu 跑得快、起得便宜，也避免每次等 Windows runner 排队。
on:
  push:
    branches: [feat/gui-protocol, next]
    paths:
      - 'src/Zentwik.Gui/**'
      - '.github/workflows/gui.yml'
  pull_request:
    branches: [feat/gui-protocol, next]
    paths:
      - 'src/Zentwik.Gui/**'
      - '.github/workflows/gui.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze and test (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Zentwik.Gui

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # 版本与开发机保持一致；升 Flutter 时两处一起改。
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      # flutter analyze 对 info 也返回非零，等于把 lint 当错误用。
      - name: Analyze
        run: flutter analyze

      # test/manual/ 下是 Windows 真机冒烟脚本，不匹配 *_test.dart，不会被收集。
      - name: Test
        run: flutter test --reporter expanded

name: Zentwik Next | Build and Release

on:
  push:
    tags:
      - 'next-v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: '要发布的标签名称（例如：next-v0.1.0-alpha.1）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build release packages (Windows)
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag_name || github.ref }}

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve release version
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag_name || github.ref_name }}"
          $v = $tag -replace '^(next-)?v', ''
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $v"

      - name: Publish CLI (Native AOT)
        run: >
          dotnet publish src/Zentwik.Cli/Zentwik.Cli.csproj
          -c Release
          -r win-x64
          -p:PublishAot=true
          -p:TrimmerSingleWarn=false
          -p:DebugType=None
          -p:DebugSymbols=false
          -p:OutputPath=./obj/cli-out/
          -o ./cli

      - name: Verify Native AOT CLI
        shell: pwsh
        run: |
          if (-not (Test-Path ./cli/zentwik.exe)) { throw "zentwik.exe is missing." }
          if (Test-Path ./cli/zentwik.dll) { throw "Managed output detected (.dll exists); Native AOT was not applied." }
          if (Test-Path ./cli/zentwik.runtimeconfig.json) { throw "runtimeconfig.json exists; Native AOT was not applied." }
          $c = (Get-Item ./cli/zentwik.exe).Length
          Write-Host ("Native CLI executable: {0:N2} MB" -f ($c / 1MB))

      - name: Publish Agent (portable)
        run: >
          dotnet publish src/Zentwik.Agent/Zentwik.Agent.csproj
          -c Release
          -r win-x64
          --self-contained false
          -p:PublishReadyToRun=true
          -p:PublishSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -p:OutputPath=./obj/agent-portable/
          -o ./pkg-portable

      - name: Publish Desktop (portable)
        run: >
          dotnet publish src/Zentwik.Desktop/Zentwik.Desktop.csproj
          -c Release
          -r win-x64
          --self-contained false
          -p:PublishReadyToRun=true
          -p:PublishSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -p:OutputPath=./obj/desktop-portable/
          -o ./pkg-portable

      - name: Publish Agent (standalone)
        run: >
          dotnet publish src/Zentwik.Agent/Zentwik.Agent.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishReadyToRun=true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -p:OutputPath=./obj/agent-standalone/
          -o ./pkg-standalone

      - name: Publish Desktop (standalone)
        run: >
          dotnet publish src/Zentwik.Desktop/Zentwik.Desktop.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishReadyToRun=true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -p:OutputPath=./obj/desktop-standalone/
          -o ./pkg-standalone

      - name: Assemble and verify release packages
        shell: pwsh
        run: |
          foreach ($dir in './pkg-portable', './pkg-standalone') {
            Copy-Item ./cli/zentwik.exe $dir -Force
            if (-not (Test-Path "$dir/Zentwik.Desktop.exe")) { throw "$dir is missing Zentwik.Desktop.exe." }
            if (-not (Test-Path "$dir/Zentwik.Agent.exe")) { throw "$dir is missing Zentwik.Agent.exe." }
            if (-not (Test-Path "$dir/zentwik.exe")) { throw "$dir is missing zentwik.exe." }
            $pdbs = Get-ChildItem $dir -Filter '*.pdb' -Recurse
            if ($pdbs.Count -gt 0) { throw "$dir contains debug symbols: $($pdbs.Name -join ', ')" }
            Write-Host ("--- {0} ---" -f $dir)
            Get-ChildItem $dir | Select-Object Name,Length | Format-Table -AutoSize | Out-String | Write-Host
          }

      - name: Create release archives
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          Compress-Archive -Path ./pkg-portable/* -DestinationPath "./Zentwik-Next-$v-Portable.zip"
          Compress-Archive -Path ./pkg-standalone/* -DestinationPath "./Zentwik-Next-$v-Standalone.zip"
          Get-ChildItem ./Zentwik-Next-*.zip | Select-Object Name,Length | Format-Table -AutoSize | Out-String | Write-Host

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zentwik-next-${{ steps.ver.outputs.version }}
          path: ./Zentwik-Next-*.zip
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          files: |
            ./Zentwik-Next-${{ steps.ver.outputs.version }}-Portable.zip
            ./Zentwik-Next-${{ steps.ver.outputs.version }}-Standalone.zip
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'can') || contains(github.event.inputs.tag_name, 'can') || contains(github.ref_name, 'alpha') || contains(github.event.inputs.tag_name, 'alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
